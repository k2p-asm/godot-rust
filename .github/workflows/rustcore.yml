name: rustcore

# Only the Rust port: the rest of the fork is upstream Godot and is covered by
# the upstream workflows.
on:
  push:
    paths:
      - "modules/rustcore/**"
      - ".github/workflows/rustcore.yml"
  pull_request:
    paths:
      - "modules/rustcore/**"
      - ".github/workflows/rustcore.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: modules/rustcore
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/rustcore
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --lib
      # The differential suite needs the C++ fixture generated by the engine's
      # own sources, which requires a full SCons checkout; it runs locally.
      - name: Differential tests (fixture must already exist)
        run: cargo test --test parity
